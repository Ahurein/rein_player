app-id: com.reinplayer.ReinPlayer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: reinplayer

finish-args:
  # Windowing
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware accelerated rendering / video decode
  - --device=dri
  # Audio
  - --socket=pulseaudio
  # Networking (URL launches, online streams, update checks)
  - --share=network
  # Files the user opens. Use --filesystem=host if you need full read access.
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=host:ro
  # Removable media (USB sticks, external drives) for video playback
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt
modules:
  - name: reinplayer
    buildsystem: simple
    build-commands:
      # App binary + Flutter assets land in /app/lib/reinplayer
      - mkdir -p /app/lib/reinplayer
      - cp -a bundle/. /app/lib/reinplayer/
      # Launcher wrapper points $PATH at the real binary
      - install -Dm755 reinplayer.sh /app/bin/reinplayer
      # Desktop entry + AppStream metadata
      - install -Dm644 com.reinplayer.ReinPlayer.desktop
          /app/share/applications/com.reinplayer.ReinPlayer.desktop
      - install -Dm644 com.reinplayer.ReinPlayer.metainfo.xml
          /app/share/metainfo/com.reinplayer.ReinPlayer.metainfo.xml
      - install -Dm644 LICENSE
          /app/share/licenses/com.reinplayer.ReinPlayer/LICENSE
      # Icons: install every size we ship under hicolor/SIZExSIZE/apps/.
      - install -Dm644 icons/64x64/icon.png
          /app/share/icons/hicolor/64x64/apps/com.reinplayer.ReinPlayer.png
      - install -Dm644 icons/128x128/icon.png
          /app/share/icons/hicolor/128x128/apps/com.reinplayer.ReinPlayer.png
      - install -Dm644 icons/256x256/icon.png
          /app/share/icons/hicolor/256x256/apps/com.reinplayer.ReinPlayer.png
      - install -Dm644 icons/512x512/icon.png
          /app/share/icons/hicolor/512x512/apps/com.reinplayer.ReinPlayer.png
    sources:
      - type: dir
        path: payload
