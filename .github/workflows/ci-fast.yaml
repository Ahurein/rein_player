name: CI Fast

on:
  workflow_dispatch:
  pull_request:
    branches: ["dev"]
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.0
          cache: true

      - name: Check Flutter
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Run packaging script
        run: ./dist/build.sh macos

      - name: Upload DMG
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/dmg/ReinPlayer-${{ github.ref_name }}.dmg
          asset_name: ReinPlayer-${{ github.ref_name }}.dmg
          tag: ${{ github.ref }}
          overwrite: true

  build-linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ahurein/flutter-gtk-mpv:latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check flutter
        run: flutter doctor

      - name: Install flutter dependencies
        run: flutter pub get

      - name: Build linux
        run: flutter build linux --release

      - name: Compress Flutter build
        run: tar -C build/linux/x64/release/bundle -cvf reinplayer_linux_amd64_portable.tar.gz .

      - name: Upload app archive for next steps
        uses: actions/upload-artifact@v4
        with:
          name: reinplayer_linux_amd64_portable
          path: reinplayer_linux_amd64_portable.tar.gz

      - name: Create .deb package
        run: ./dist/build.sh deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reinplayer_linux_amd64.deb.zip
          path: build/reinplayer_linux_amd64.deb

      - name: Upload linux binary
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: reinplayer_linux_amd64_portable.tar.gz
          asset_name: reinplayer_linux_amd64_portable.tar.gz
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload debian package
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/reinplayer_linux_amd64.deb
          asset_name: reinplayer_linux_amd64.deb
          tag: ${{ github.ref }}
          overwrite: true

  build-linux-flatpak:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Linux build and Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv flatpak flatpak-builder \
            appstream desktop-file-utils

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.0
          cache: true

      - name: Build Flutter Linux bundle
        run: |
          flutter pub get
          flutter build linux --release

      - name: Validate Flatpak metadata
        run: |
          appstreamcli validate --pedantic dist/flatpak/com.reinplayer.ReinPlayer.metainfo.xml
          desktop-file-validate dist/flatpak/com.reinplayer.ReinPlayer.desktop

      - name: Build Flatpak bundle
        run: ./dist/build.sh flatpak

      - name: Check installed Flatpak dependencies
        run: |
          flatpak install --user --noninteractive -y \
            build/ReinPlayer-*-x86_64.flatpak
          if ! dependency_report="$(flatpak run --user --command=sh \
            com.reinplayer.ReinPlayer -c '
              export LD_LIBRARY_PATH="/app/lib/reinplayer/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
              LD_TRACE_LOADED_OBJECTS=1 /app/lib/reinplayer/rein_player
            ' 2>&1)"; then
            printf '%s\n' "$dependency_report"
            exit 1
          fi
          printf '%s\n' "$dependency_report"
          if printf '%s\n' "$dependency_report" | grep -E '=> not found|version .* not found'; then
            exit 1
          fi

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: reinplayer-flatpak
          path: build/ReinPlayer-*-x86_64.flatpak
          if-no-files-found: error

      - name: Upload Flatpak to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ReinPlayer-*-x86_64.flatpak
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true

